services:
  - type: web
    name: freshway-water-pos-api
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        sync: false
    disk:
      name: freshway-pos-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
